<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Personalized Predictions</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #111827, #312e81);
      color: white;
      overflow: hidden;
    }

    .card {
      width: min(90%, 430px);
      padding: 36px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(14px);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
      text-align: center;
    }

    h1 {
      margin-top: 0;
      font-size: 28px;
    }

    p {
      color: #d1d5db;
      line-height: 1.6;
    }

    select {
      width: 100%;
      margin-top: 20px;
      padding: 14px 16px;
      border: 0;
      border-radius: 10px;
      background: white;
      color: #111827;
      font-size: 16px;
      cursor: pointer;
      outline: none;
    }

    .prediction {
      margin-top: 24px;
      padding: 18px;
      border-radius: 12px;
      background: rgba(0, 0, 0, 0.2);
      display: none;
    }

    /* Hidden meltdown state */
    body.meltdown {
      background: #000 !important;
      font-family: "Courier New", monospace;
    }

    body.meltdown .card {
      display: none;
    }

    #matrix {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 9998;
      padding: 25px;
      color: #00ff41;
      font-family: "Courier New", monospace;
      font-size: clamp(14px, 2vw, 22px);
      line-height: 1.3;
      overflow: hidden;
      white-space: pre-wrap;
      text-shadow: 0 0 8px #00ff41;
    }

    body.meltdown #matrix {
      display: block;
    }

    #alerts {
      position: fixed;
      inset: 0;
      z-index: 9999;
      pointer-events: none;
    }

    .fake-alert {
      position: absolute;
      min-width: 240px;
      padding: 18px;
      background: #d9d9d9;
      color: #111;
      border: 3px solid #fff;
      box-shadow: 8px 8px 0 #555;
      font-family: Arial, sans-serif;
      animation: alertFlash 0.25s infinite alternate;
    }

    .fake-alert strong {
      display: block;
      margin-bottom: 8px;
      color: #b00000;
    }

    @keyframes alertFlash {
      from { opacity: 0.7; transform: scale(0.98); }
      to   { opacity: 1; transform: scale(1.02); }
    }

    .glitch {
      animation: glitch 0.08s infinite;
    }

    @keyframes glitch {
      0%   { transform: translate(0); }
      25%  { transform: translate(4px, -2px); }
      50%  { transform: translate(-3px, 3px); }
      75%  { transform: translate(2px, 1px); }
      100% { transform: translate(0); }
    }
  </style>
</head>

<body>

  <main class="card">
    <h1>Personalized Predictions</h1>
    <p>
      Enter your birth year to customize your prediction.
    </p>

    <select id="birthYear" aria-label="Enter your birth year">
      <option value="">Enter Your Birth Year</option>
    </select>

    <div class="prediction" id="prediction"></div>
  </main>

  <div id="matrix"></div>
  <div id="alerts"></div>

  <script>
    const yearSelect = document.getElementById("birthYear");
    const prediction = document.getElementById("prediction");
    const matrix = document.getElementById("matrix");
    const alerts = document.getElementById("alerts");

    // Populate years
    const currentYear = new Date().getFullYear();

    for (let year = currentYear; year >= 1900; year--) {
      const option = document.createElement("option");
      option.value = year;
      option.textContent = year;
      yearSelect.appendChild(option);
    }

    // Normal prediction behavior
    yearSelect.addEventListener("change", () => {
      const year = yearSelect.value;

      if (!year) {
        prediction.style.display = "none";
        return;
      }

      prediction.style.display = "block";
      prediction.innerHTML =
        `<strong>Your prediction for ${year}:</strong><br>
         A new chapter is waiting for you.`;
      
      if (year === "1999") {
        startMeltdown();
      }
    });

    function startMeltdown() {
      document.body.classList.add("meltdown");
      document.body.classList.add("glitch");

      const characters =
        "01ABCDEFGHIJKLMNOPQRSTUVWXYZ#$%@&*!<>[]{}";

      function generateMatrix() {
        let output = "";

        for (let i = 0; i < 2500; i++) {
          output += characters[
            Math.floor(Math.random() * characters.length)
          ];

          if (i % 80 === 0) output += "\n";
        }

        matrix.textContent = output;
      }

      generateMatrix();

      // Rapidly change the text
      setInterval(generateMatrix, 70);

      // Create fake alerts
      const messages = [
        "SYSTEM ERROR",
        "MEMORY FAILURE",
        "DATE SYSTEM CORRUPTED",
        "CRITICAL EXCEPTION",
        "LEGACY SYSTEM FAILURE",
        "CLOCK SYNCHRONIZATION ERROR",
        "DATA INTEGRITY WARNING"
      ];

      setInterval(() => {
        const alert = document.createElement("div");
        alert.className = "fake-alert";

        alert.style.left =
          Math.random() * Math.max(0, window.innerWidth - 280) + "px";

        alert.style.top =
          Math.random() * Math.max(0, window.innerHeight - 150) + "px";

        alert.innerHTML = `
          <strong>${messages[Math.floor(Math.random() * messages.length)]}</strong>
          Unexpected system condition detected.<br>
          Error code: 0x${Math.floor(Math.random() * 99999)
            .toString(16)
            .toUpperCase()}
        `;

        alerts.appendChild(alert);

        setTimeout(() => alert.remove(), 1400);
      }, 180);
    }
  </script>

</body>
</html>
